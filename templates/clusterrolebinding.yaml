apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ci-cd-demo.fullname" . }}-cluster-rolebinding
subjects:
- kind: ServiceAccount
  name: {{ include "ci-cd-demo.fullname" . }}-sa
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "ci-cd-demo.fullname" . }}-cluster-role
  apiGroup: rbac.authorization.k8s.io
